<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CYBX // FREE FOR ALL</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="alternate icon" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&family=Rajdhani:wght@600;700;800&family=Chakra+Petch:wght@500;700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #03060c;
      color: #f1f5f9;
      font-family: 'Rajdhani', 'Chakra Petch', sans-serif;
    }

    /* Cyberpunk Button Utility Classes */
    .cyber-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: 'Orbitron', sans-serif;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      padding: 13px 22px;
      cursor: pointer;
      border: none;
      outline: none;
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px);
      overflow: hidden;
    }
    .cyber-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.28), transparent);
      transform: translateX(-100%);
      transition: transform 0.5s ease;
    }
    .cyber-btn:hover::before {
      transform: translateX(100%);
    }
    .cyber-btn:active {
      transform: scale(0.97);
    }

    .cyber-btn-red {
      background: linear-gradient(135deg, #b91c1c 0%, #dc2626 50%, #991b1b 100%);
      color: #ffffff;
      box-shadow: 0 0 22px rgba(220, 38, 38, 0.55), inset 0 0 12px rgba(254, 202, 202, 0.25);
      border-left: 3px solid #f87171;
    }
    .cyber-btn-red:hover {
      background: linear-gradient(135deg, #dc2626 0%, #ef4444 50%, #b91c1c 100%);
      box-shadow: 0 0 35px rgba(239, 68, 68, 0.85), inset 0 0 18px rgba(255, 255, 255, 0.4);
      filter: brightness(1.15);
    }

    .cyber-btn-cyan {
      background: linear-gradient(135deg, #0369a1 0%, #0284c7 50%, #075985 100%);
      color: #ffffff;
      box-shadow: 0 0 22px rgba(14, 165, 233, 0.55), inset 0 0 12px rgba(186, 230, 253, 0.25);
      border-left: 3px solid #38bdf8;
    }
    .cyber-btn-cyan:hover {
      background: linear-gradient(135deg, #0284c7 0%, #0ea5e9 50%, #0369a1 100%);
      box-shadow: 0 0 35px rgba(56, 189, 248, 0.85), inset 0 0 18px rgba(255, 255, 255, 0.4);
      filter: brightness(1.15);
    }

    .cyber-btn-gold {
      background: linear-gradient(135deg, #b45309 0%, #d97706 50%, #78350f 100%);
      color: #0f172a;
      box-shadow: 0 0 22px rgba(245, 158, 11, 0.55), inset 0 0 12px rgba(254, 240, 138, 0.4);
      border-left: 3px solid #fde047;
    }
    .cyber-btn-gold:hover {
      background: linear-gradient(135deg, #d97706 0%, #f59e0b 50%, #b45309 100%);
      box-shadow: 0 0 35px rgba(251, 191, 36, 0.85), inset 0 0 18px rgba(255, 255, 255, 0.6);
      filter: brightness(1.15);
    }

    .cyber-btn-stealth {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.45);
      color: #38bdf8;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.2), inset 0 0 10px rgba(56, 189, 248, 0.1);
    }
    .cyber-btn-stealth:hover {
      background: rgba(56, 189, 248, 0.2);
      border-color: #38bdf8;
      color: #ffffff;
      box-shadow: 0 0 28px rgba(56, 189, 248, 0.65), inset 0 0 14px rgba(56, 189, 248, 0.3);
    }

    .cyber-btn-boss {
      background: linear-gradient(135deg, #991b1b 0%, #dc2626 50%, #7f1d1d 100%);
      color: #ffffff;
      font-size: 18px;
      letter-spacing: 3px;
      box-shadow: 0 0 35px rgba(239, 68, 68, 0.7), inset 0 0 20px rgba(254, 202, 202, 0.3);
      border: 2px solid #fca5a5;
      animation: cyber-pulse 2s infinite ease-in-out;
    }
    .cyber-btn-boss:hover {
      background: linear-gradient(135deg, #dc2626 0%, #ef4444 50%, #991b1b 100%);
      box-shadow: 0 0 55px rgba(239, 68, 68, 1), inset 0 0 25px rgba(255, 255, 255, 0.5);
      transform: scale(1.02);
    }

    @keyframes cyber-pulse {
      0%, 100% { box-shadow: 0 0 30px rgba(239, 68, 68, 0.6); }
      50% { box-shadow: 0 0 55px rgba(239, 68, 68, 0.95); }
    }

    #game-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* Modern Blood & CRT Scanline Vibe */
    .vignette {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.85);
      z-index: 5;
    }

    /* Deadlock Shop Modal */
    #shop-overlay {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 900px;
      max-width: 95vw;
      height: 600px;
      max-height: 90vh;
      background: rgba(15, 18, 28, 0.96);
      border: 2px solid #334155;
      border-radius: 12px;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.9), 0 0 15px rgba(245, 158, 11, 0.2);
      z-index: 100;
      flex-direction: column;
      overflow: hidden;
      backdrop-filter: blur(8px);
    }
    #shop-overlay.open {
      display: flex;
    }
    .shop-header {
      padding: 16px 24px;
      background: #111422;
      border-bottom: 1px solid #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .shop-title {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #f59e0b;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .shop-points-badge {
      font-size: 18px;
      background: #1e293b;
      color: #fbbf24;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: 800;
      border: 1px solid #d97706;
    }
    .shop-close-btn {
      background: transparent;
      border: 1px solid #475569;
      color: #94a3b8;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
      transition: all 0.2s;
    }
    .shop-close-btn:hover {
      background: #ef4444;
      color: #fff;
      border-color: #ef4444;
    }
    .shop-columns {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 16px;
      padding: 20px;
      flex: 1;
      overflow-y: auto;
    }
    .shop-col {
      background: rgba(22, 27, 43, 0.6);
      border-radius: 8px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border-top: 4px solid #64748b;
    }
    .shop-col.col-weapon { border-top-color: #f97316; }
    .shop-col.col-vitality { border-top-color: #22c55e; }
    .shop-col.col-spirit { border-top-color: #a855f7; }

    .col-title {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 16px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: flex;
      justify-content: space-between;
    }
    .col-weapon .col-title { color: #f97316; }
    .col-vitality .col-title { color: #22c55e; }
    .col-spirit .col-title { color: #c084fc; }

    .item-card {
      background: #161c2d;
      border: 1px solid #2d3748;
      border-radius: 6px;
      padding: 10px;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .item-card:hover {
      border-color: #f59e0b;
      transform: translateY(-2px);
    }
    .item-card.owned {
      border-color: #10b981;
      background: #0f2723;
      opacity: 0.75;
    }
    .item-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .item-name {
      font-weight: 700;
      font-size: 14px;
      color: #f8fafc;
    }
    .item-cost {
      font-size: 12px;
      font-weight: 800;
      color: #fbbf24;
      background: #0f172a;
      padding: 2px 8px;
      border-radius: 4px;
    }
    .item-desc {
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.35;
    }
    .item-buy-btn {
      background: #d97706;
      border: none;
      color: #0f172a;
      padding: 5px 8px;
      border-radius: 4px;
      font-weight: 800;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s;
      align-self: flex-end;
    }
    .item-buy-btn:hover:not(:disabled) {
      background: #f59e0b;
    }
    .item-buy-btn:disabled {
      background: #334155;
      color: #64748b;
      cursor: not-allowed;
    }

    /* Notification Banner */
    #banner-container {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: none;
      z-index: 50;
    }
    .game-banner {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 2px;
      padding: 8px 24px;
      border-radius: 6px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid currentColor;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
      animation: bannerSlide 3.5s forwards;
    }
    @keyframes bannerSlide {
      0% { opacity: 0; transform: translateY(-20px); }
      15% { opacity: 1; transform: translateY(0); }
      85% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-10px); }
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <div class="vignette"></div>

  <!-- Banners -->
  <div id="banner-container"></div>

  <!-- Deadlock Shop Modal -->
  <div id="shop-overlay">
    <div class="shop-header">
      <div class="shop-title">
        <span>⚡ SKLEP ULEPSZEŃ (DEADLOCK)</span>
      </div>
      <div class="shop-points-badge" id="shop-points-display">
        💰 500 PKT
      </div>
      <button class="shop-close-btn" id="shop-close-btn">[B / ESC] ZAMKNIJ</button>
    </div>
    <div class="shop-columns">
      <!-- Weapon Column -->
      <div class="shop-col col-weapon" id="col-weapon">
        <div class="col-title">
          <span>⚔️ BROŃ (WEAPON)</span>
        </div>
        <div class="items-list" id="weapon-items-container"></div>
      </div>

      <!-- Vitality Column -->
      <div class="shop-col col-vitality" id="col-vitality">
        <div class="col-title">
          <span>🛡️ PRZETRWANIE (VITALITY)</span>
        </div>
        <div class="items-list" id="vitality-items-container"></div>
      </div>

      <!-- Spirit Column -->
      <div class="shop-col col-spirit" id="col-spirit">
        <div class="col-title">
          <span>🔮 SPIRIT (ZDOLNOŚCI)</span>
        </div>
        <div class="items-list" id="spirit-items-container"></div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
