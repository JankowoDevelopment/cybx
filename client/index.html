<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>cybx - pvp</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="alternate icon" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #090a0f;
      color: #f1f5f9;
      font-family: 'Inter', sans-serif;
    }

    #game-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* Modern Blood & CRT Scanline Vibe */
    .vignette {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.85);
      z-index: 5;
    }

    /* Deadlock Shop Modal */
    #shop-overlay {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 900px;
      max-width: 95vw;
      height: 600px;
      max-height: 90vh;
      background: rgba(15, 18, 28, 0.96);
      border: 2px solid #334155;
      border-radius: 12px;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.9), 0 0 15px rgba(245, 158, 11, 0.2);
      z-index: 100;
      flex-direction: column;
      overflow: hidden;
      backdrop-filter: blur(8px);
    }
    #shop-overlay.open {
      display: flex;
    }
    .shop-header {
      padding: 16px 24px;
      background: #111422;
      border-bottom: 1px solid #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .shop-title {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #f59e0b;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .shop-points-badge {
      font-size: 18px;
      background: #1e293b;
      color: #fbbf24;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: 800;
      border: 1px solid #d97706;
    }
    .shop-close-btn {
      background: transparent;
      border: 1px solid #475569;
      color: #94a3b8;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
      transition: all 0.2s;
    }
    .shop-close-btn:hover {
      background: #ef4444;
      color: #fff;
      border-color: #ef4444;
    }
    .shop-columns {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 16px;
      padding: 20px;
      flex: 1;
      overflow-y: auto;
    }
    .shop-col {
      background: rgba(22, 27, 43, 0.6);
      border-radius: 8px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border-top: 4px solid #64748b;
    }
    .shop-col.col-weapon { border-top-color: #f97316; }
    .shop-col.col-vitality { border-top-color: #22c55e; }
    .shop-col.col-spirit { border-top-color: #a855f7; }

    .col-title {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 16px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: flex;
      justify-content: space-between;
    }
    .col-weapon .col-title { color: #f97316; }
    .col-vitality .col-title { color: #22c55e; }
    .col-spirit .col-title { color: #c084fc; }

    .item-card {
      background: #161c2d;
      border: 1px solid #2d3748;
      border-radius: 6px;
      padding: 10px;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .item-card:hover {
      border-color: #f59e0b;
      transform: translateY(-2px);
    }
    .item-card.owned {
      border-color: #10b981;
      background: #0f2723;
      opacity: 0.75;
    }
    .item-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .item-name {
      font-weight: 700;
      font-size: 14px;
      color: #f8fafc;
    }
    .item-cost {
      font-size: 12px;
      font-weight: 800;
      color: #fbbf24;
      background: #0f172a;
      padding: 2px 8px;
      border-radius: 4px;
    }
    .item-desc {
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.35;
    }
    .item-buy-btn {
      background: #d97706;
      border: none;
      color: #0f172a;
      padding: 5px 8px;
      border-radius: 4px;
      font-weight: 800;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s;
      align-self: flex-end;
    }
    .item-buy-btn:hover:not(:disabled) {
      background: #f59e0b;
    }
    .item-buy-btn:disabled {
      background: #334155;
      color: #64748b;
      cursor: not-allowed;
    }

    /* Notification Banner */
    #banner-container {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: none;
      z-index: 50;
    }
    .game-banner {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 2px;
      padding: 8px 24px;
      border-radius: 6px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid currentColor;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
      animation: bannerSlide 3.5s forwards;
    }
    @keyframes bannerSlide {
      0% { opacity: 0; transform: translateY(-20px); }
      15% { opacity: 1; transform: translateY(0); }
      85% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-10px); }
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <div class="vignette"></div>

  <!-- Banners -->
  <div id="banner-container"></div>

  <!-- Deadlock Shop Modal -->
  <div id="shop-overlay">
    <div class="shop-header">
      <div class="shop-title">
        <span>⚡ SKLEP ULEPSZEŃ (DEADLOCK)</span>
      </div>
      <div class="shop-points-badge" id="shop-points-display">
        💰 500 PKT
      </div>
      <button class="shop-close-btn" id="shop-close-btn">[B / ESC] ZAMKNIJ</button>
    </div>
    <div class="shop-columns">
      <!-- Weapon Column -->
      <div class="shop-col col-weapon" id="col-weapon">
        <div class="col-title">
          <span>⚔️ BROŃ (WEAPON)</span>
        </div>
        <div class="items-list" id="weapon-items-container"></div>
      </div>

      <!-- Vitality Column -->
      <div class="shop-col col-vitality" id="col-vitality">
        <div class="col-title">
          <span>🛡️ PRZETRWANIE (VITALITY)</span>
        </div>
        <div class="items-list" id="vitality-items-container"></div>
      </div>

      <!-- Spirit Column -->
      <div class="shop-col col-spirit" id="col-spirit">
        <div class="col-title">
          <span>🔮 SPIRIT (ZDOLNOŚCI)</span>
        </div>
        <div class="items-list" id="spirit-items-container"></div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
