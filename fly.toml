# fly.toml app configuration file generated for Deadlock Zombies

app = "deadlock-zombies-game"
primary_region = "fra" # Frankfurt (closest active region to Poland, ultra-low latency)

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "4096mb"
  cpu_kind = "shared"
  cpus = 4
